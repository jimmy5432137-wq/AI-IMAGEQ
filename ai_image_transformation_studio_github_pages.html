                                className="px-2 py-1.5 rounded-lg bg-violet-600/20 hover:bg-violet-600/30 text-violet-300 border border-violet-500/30 flex items-center justify-center gap-1"
                              >
                                <Icon name="brush" className="w-3 h-3" />
                                <span>局部微調</span>
                              </button>
                              <button
                                type="button"
                                onClick={() => setResultAsImageA(item.objectUrl)}
                                className="px-2 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center gap-1"
                              >
                                <Icon name="refresh" className="w-3 h-3" />
                                <span>設為主角 A</span>
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === "mask" && (
              <SimpleMaskEditor
                targetImage={maskTarget || availableMaskSources[0] || null}
                referenceImage={imageA}
                availableSources={availableMaskSources}
                onSelectSource={setMaskTarget}
                onExecuteInpaint={handleInpaint}
                isGenerating={isGenerating}
                darkMode={darkMode}
              />
            )}

            {activeTab === "history" && (
              <div className="space-y-5">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-bold">歷史生成作品集</h2>
                    <p className="text-xs text-zinc-400">查看過往轉換結果、下載或一鍵套用當時的設定</p>
                  </div>

                  <div className="flex items-center gap-2">
                    <div className="relative">
                      <Icon
                        name="search"
                        className="w-3.5 h-3.5 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2"
                      />
                      <input
                        type="text"
                        value={historySearch}
                        onChange={(e) => setHistorySearch(e.target.value)}
                        placeholder="搜尋描述關鍵字..."
                        className={`pl-8 pr-3 py-1.5 rounded-xl border text-xs ${
                          darkMode ? "bg-zinc-900 border-zinc-800" : "bg-white border-zinc-300"
                        }`}
                      />
                    </div>
                    <button
                      type="button"
                      onClick={() => setOnlyFavorites((f) => !f)}
                      className={`px-3 py-1.5 rounded-xl border text-xs flex items-center gap-1 ${
                        onlyFavorites
                          ? "bg-amber-500/20 border-amber-500/40 text-amber-300"
                          : darkMode
                          ? "bg-zinc-900 border-zinc-800 text-zinc-300"
                          : "bg-white border-zinc-300 text-zinc-700"
                      }`}
                    >
                      <Icon name="star" className="w-3.5 h-3.5" />
                      <span>收藏</span>
                    </button>
                  </div>
                </div>

                {filteredHistory.length === 0 ? (
                  <div className={`rounded-2xl border p-12 text-center ${surfaceBg}`}>
                    <Icon name="history" className="w-10 h-10 mx-auto mb-2 text-zinc-500 opacity-50" />
                    <p className="text-sm font-medium">目前尚無歷史作品紀錄</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    {filteredHistory.map((item) => (
                      <div key={item.id} className={`rounded-2xl border overflow-hidden flex flex-col ${surfaceBg}`}>
                        <div className="relative aspect-[3/4] bg-black">
                          <img
                            src={item.resultUrl}
                            alt="History"
                            onClick={() => setCompareItem({ objectUrl: item.resultUrl })}
                            className="w-full h-full object-contain cursor-zoom-in"
                          />
                          <button
                            type="button"
                            onClick={() =>
                              setHistory((prev) =>
                                prev.map((h) => (h.id === item.id ? { ...h, favorite: !h.favorite } : h))
                              )
                            }
                            className={`absolute top-2 right-2 p-1.5 rounded-lg backdrop-blur-md border ${
                              item.favorite
                                ? "bg-amber-500/30 border-amber-400 text-amber-300"
                                : "bg-black/60 border-white/15 text-zinc-300"
                            }`}
                          >
                            <Icon name="star" className="w-3.5 h-3.5" />
                          </button>
                        </div>

                        <div className="p-3.5 space-y-2.5 flex-1 flex flex-col justify-between">
                          <div>
                            <div className="text-[11px] text-zinc-400 font-mono">{item.timestamp}</div>
                            <p className="text-xs text-zinc-300 line-clamp-2 mt-1">{item.userPrompt}</p>
                          </div>

                          <div className="grid grid-cols-3 gap-1.5 pt-2 border-t border-zinc-800/80 text-[11px]">
                            <button
                              type="button"
                              onClick={() => {
                                setUserPrompt(item.userPrompt || "");
                                if (item.weights) setWeights(item.weights);
                                setActiveTab("studio");
                                notify("info", "已套用歷史參數設定");
                              }}
                              className="px-2 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 flex items-center justify-center gap-1"
                            >
                              <Icon name="refresh" className="w-3 h-3" />
                              <span>套用</span>
                            </button>
                            <button
                              type="button"
                              onClick={() => downloadObjectUrl(item.resultUrl, `gemini_${Date.now()}.png`)}
                              className="px-2 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center gap-1"
                            >
                              <Icon name="download" className="w-3 h-3" />
                              <span>下載</span>
                            </button>
                            <button
                              type="button"
                              onClick={() => handleDeleteHistoryItem(item)}
                              className="px-2 py-1.5 rounded-lg bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 flex items-center justify-center gap-1"
                            >
                              <Icon name="trash" className="w-3 h-3" />
                              <span>刪除</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          <SplitCompareModal
            item={compareItem}
            sourceA={imageA}
            sourceB={imageB}
            onClose={() => setCompareItem(null)}
            onDownload={downloadObjectUrl}
          />

          <ApiConfigModal
            isOpen={isConfigOpen}
            onClose={() => setIsConfigOpen(false)}
            apiKey={apiKey}
            onSaveApiKey={(k) => {
              saveApiKey(k);
              notify("success", k ? "已儲存工作階段 Gemini API Key" : "已清除 API Key");
            }}
            proxyUrl={proxyUrl}
            onSaveProxyUrl={(p) => {
              saveProxyUrl(p);
              if (p.trim()) notify("success", "已啟用後端安全代理端點");
            }}
            darkMode={darkMode}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
