    class ObjectUrlManager {
      constructor() {
        this.urls = new Set();
      }
      create(blob) {
        const url = URL.createObjectURL(blob);
        this.urls.add(url);
        return url;
      }
      revoke(url) {
        if (url && typeof url === "string" && url.startsWith("blob:") && this.urls.has(url)) {
          URL.revokeObjectURL(url);
          this.urls.delete(url);
        }
      }
      revokeAll() {
        this.urls.forEach((url) => {
          try {
            URL.revokeObjectURL(url);
          } catch {}
        });
        this.urls.clear();
      }
    }

    function base64ToBlob(base64Data, mimeType = "image/png") {
      const byteCharacters = atob(base64Data);
      const byteArrays = [];
      const sliceSize = 8192;
      for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
        const slice = byteCharacters.slice(offset, offset + sliceSize);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) {
          byteNumbers[i] = slice.charCodeAt(i);
        }
        byteArrays.push(new Uint8Array(byteNumbers));
      }
      return new Blob(byteArrays, { type: mimeType });
    }

    async function blobUrlToInlineData(blobOrDataUrl) {
      if (!blobOrDataUrl) throw new Error("無效的圖片資源");
      if (blobOrDataUrl.startsWith("data:")) {
        const [meta, base64] = blobOrDataUrl.split(",");
        const mimeType = meta.match(/:(.*?);/)?.[1] || "image/jpeg";
        return { mimeType, data: base64 };
      }
      const response = await fetch(blobOrDataUrl);
      const blob = await response.blob();
      const mimeType = blob.type || "image/jpeg";
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const dataUrl = reader.result;
          const base64 = typeof dataUrl === "string" ? dataUrl.split(",")[1] : "";
          resolve({ mimeType, data: base64 });
        };
        reader.onerror = () => reject(new Error("讀取圖片二進位資料失敗"));
        reader.readAsDataURL(blob);
      });
    }

    async function processUploadedImage(file, urlManager) {
      const tempRawUrl = URL.createObjectURL(file);
      try {
        return await new Promise((resolve, reject) => {
          const img = new window.Image();
          img.onload = () => {
            const MAX_DIM = 1024;
            let targetW = img.naturalWidth;
            let targetH = img.naturalHeight;
            if (Math.max(targetW, targetH) > MAX_DIM) {
              const scale = MAX_DIM / Math.max(targetW, targetH);
              targetW = Math.round(targetW * scale);
              targetH = Math.round(targetH * scale);
            }

            const canvas = document.createElement("canvas");
            canvas.width = targetW;
            canvas.height = targetH;
            canvas.getContext("2d").drawImage(img, 0, 0, targetW, targetH);

            canvas.toBlob(
              (blob) => {
                if (!blob) {
                  reject(new Error("圖片壓縮轉換 Blob 失敗。"));
                  return;
                }
                const objectUrl = urlManager.create(blob);
                resolve({
                  name: file.name,
                  sizeFormatted:
                    blob.size > 1024 * 1024
                      ? `${(blob.size / (1024 * 1024)).toFixed(2)} MB`
                      : `${(blob.size / 1024).toFixed(1)} KB`,
                  width: targetW,
                  height: targetH,
                  objectUrl
                });
              },
              "image/jpeg",
              0.9
            );
          };
          img.onerror = () => reject(new Error("圖片解碼失敗，請確認檔案格式是否正確。"));
          img.src = tempRawUrl;
        });
      } finally {
        URL.revokeObjectURL(tempRawUrl);
      }
    }

    async function renderSkeletonMapBlob(keypoints, width = 768, height = 1024) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      const kpMap = {};
      keypoints.forEach((kp) => {
        kpMap[kp.id] = kp;
      });

      ctx.lineWidth = Math.max(4, Math.round(width * 0.008));
      ctx.lineCap = "round";
      POSE_LIMBS.forEach(([a, b, color]) => {
        const p1 = kpMap[a];
        const p2 = kpMap[b];
        if (p1 && p2) {
          ctx.strokeStyle = color;
          ctx.beginPath();
          ctx.moveTo((p1.x / 1000) * width, (p1.y / 1000) * height);
          ctx.lineTo((p2.x / 1000) * width, (p2.y / 1000) * height);
          ctx.stroke();
        }
      });

      const radius = Math.max(5, Math.round(width * 0.01));
      keypoints.forEach((kp) => {
        ctx.fillStyle = kp.color;
        ctx.beginPath();
        ctx.arc((kp.x / 1000) * width, (kp.y / 1000) * height, radius, 0, Math.PI * 2);
        ctx.fill();
      });

      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), "image/png");
      });
    }

    function parseGeminiJsonSafe(rawText) {
      if (!rawText || typeof rawText !== "string") {

      }
      let cleaned = rawText.trim();
      cleaned = cleaned.replace(/^```(?:json|JSON)?\s*/i, "").replace(/\s*```$/i, "").trim();

      try {
        return JSON.parse(cleaned);
      } catch {
        const firstBrace = cleaned.indexOf("{");
        const lastBrace = cleaned.lastIndexOf("}");
        if (firstBrace !== -1 && lastBrace > firstBrace) {
          return JSON.parse(cleaned.slice(firstBrace, lastBrace + 1));
        }
        throw new Error("模型結構化資料解析失敗（格式非有效 JSON）。");
      }
    }

    async function callGeminiEndpoint(modelName, payload, signal, authConfig = {}) {
      const { apiKey = "", proxyUrl = "" } = authConfig;
      const trimmedProxy = proxyUrl.trim();
      const trimmedKey = apiKey.trim();

      const endpointUrl = trimmedProxy
        ? `${trimmedProxy.replace(/\/$/, "")}/models/${modelName}:generateContent`
        : `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent${
            trimmedKey ? `?key=${encodeURIComponent(trimmedKey)}` : ""
          }`;

      const RETRYABLE_STATUS = new Set([408, 429, 500, 502, 503, 504]);
      const MAX_RETRIES = 2;
      let delay = 1000;
      let lastError = null;

      for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
        try {
          const res = await fetch(endpointUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            signal,
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            return await res.json();
          }

          const errBody = await res.text().catch(() => "");
          let parsedMsg = errBody;
          try {
            const errJson = JSON.parse(errBody);
            parsedMsg = errJson?.error?.message || errBody;
          } catch {}

          if (!RETRYABLE_STATUS.has(res.status)) {
            if (res.status === 401 || res.status === 403 || res.status === 400) {
              throw new Error(
                `API 金鑰無效或未設定 (${res.status})：請點擊右上角「設定 API Key」填入有效的 Gemini API Key。`
              );
            }
            throw new Error(`請求錯誤 (${res.status}): ${parsedMsg || res.statusText}`);
          }

          lastError = new Error(`伺服器暫時忙碌 (${res.status}): ${parsedMsg || res.statusText}`);
          if (attempt < MAX_RETRIES) {
            await new Promise((r) => setTimeout(r, delay));
            delay *= 2;
            continue;
          }
        } catch (err) {
          if (err.name === "AbortError") throw err;
          if (
            err.message?.startsWith("API 金鑰無效") ||
            err.message?.startsWith("請求錯誤")
          ) {
            throw err;
          }
          lastError = err;
          if (attempt < MAX_RETRIES) {
            await new Promise((r) => setTimeout(r, delay));
            delay *= 2;
          }
        }
      }

      throw lastError || new Error("無法連線至 Gemini 影像服務，請確認網路狀態或 API 設定。");
    }

    async function analyzeSubjectIdentityA(imageObjectUrl, authConfig) {
      const inlineData = await blobUrlToInlineData(imageObjectUrl);
      const prompt = `Describe the visual styling and portrait characteristics of the subject in this photo for fashion editorial continuity:
1. subjectPortraitSummary: Concise, objective description of apparent age range, gender presentation, hair length/color/style, facial structure, glasses/accessories, and skin tone under neutral daylight.
2. originalOutfit: Brief description of what they are currently wearing in this photo.
Keep it strictly objective and photography-focused (2 sentences).`;

      const payload = {
        contents: [{ role: "user", parts: [{ text: prompt }, { inlineData }] }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              subjectPortraitSummary: { type: "STRING" },
              originalOutfit: { type: "STRING" }
            }
          }
        }
      };

      const result = await callGeminiEndpoint(GEMINI_VISION_MODEL, payload, undefined, authConfig);
      const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) return null;
      return parseGeminiJsonSafe(rawText);
    }

    async function analyzeReferenceImageB(imageObjectUrl, authConfig) {
      const inlineData = await blobUrlToInlineData(imageObjectUrl);
      const prompt = `Analyze ONLY the pose, outfit, and photographic composition of this fashion reference image (do NOT describe facial identity).
Return structured JSON with concrete, photography-safe details:
1. poseDescription: Exact human body posture, head angle, gaze direction, shoulder alignment, arm/hand placement, and stance.
2. outfitDescription: Complete clothing styling breakdown—garment types, colors, patterns, fabric textures, collar/neckline, sleeves, and footwear/accessories.
3. compositionAndLighting: Shot framing (close-up, half-body, three-quarter, full-body), camera angle, background setting, and studio/natural lighting mood.
4. summary: Concise 2-sentence editorial direction combining pose, outfit, framing, and lighting.
5. keypoints: Normalized 0-1000 coordinates (x: 0 left to 1000 right, y: 0 top to 1000 bottom) for the 18 COCO landmarks: nose, neck, r_shoulder, r_elbow, r_wrist, l_shoulder, l_elbow, l_wrist, r_hip, r_knee, r_ankle, l_hip, l_knee, l_ankle, r_eye, l_eye, r_ear, l_ear.`;

      const payload = {
        contents: [{ role: "user", parts: [{ text: prompt }, { inlineData }] }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              poseDescription: { type: "STRING" },
              outfitDescription: { type: "STRING" },
              compositionAndLighting: { type: "STRING" },
              summary: { type: "STRING" },
              keypoints: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    id: { type: "STRING" },
                    x: { type: "NUMBER" },
                    y: { type: "NUMBER" }
                  }
                }
              }
            }
          }
        }
      };

      const result = await callGeminiEndpoint(GEMINI_VISION_MODEL, payload, undefined, authConfig);
      const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error("無法解析參考照片的姿勢與服裝結構。");
      return parseGeminiJsonSafe(rawText);
    }

    function extractGeneratedBlobFromResponse(result, urlManager) {
      const candidate = result?.candidates?.[0];
      const imgPart = candidate?.content?.parts?.find((p) => p.inlineData);
      if (!imgPart?.inlineData?.data) {
        const reason = candidate?.finishReason || "NO_IMAGE";
        const err = new Error(`模型未回傳圖片（狀態：${reason}）`);
        err.finishReason = reason;
        throw err;
      }
      const mimeType = imgPart.inlineData.mimeType || "image/png";
      const blob = base64ToBlob(imgPart.inlineData.data, mimeType);
      const objectUrl = urlManager.create(blob);
      return { objectUrl, note: "Gemini 生成完成" };
    }

    async function generateGeminiTransformation(params, signal) {
      const {
        mode,
        strategy = "disentangled",
        imageAUrl,
        imageBUrl,
        keypoints,
        imageBSize,
        weights,
        userPrompt,
        aspectRatio,
        variations,
        poseAnalysis,
        subjectAnchor,
        authConfig,
        urlManager,
        onProgress,
        onItemReady
      } = params;

      const totalCount = Math.min(Math.max(1, variations || 1), 4);
      const batchStartTime = performance.now();
      let completedCount = 0;

      onProgress?.({
        stage: "步驟 1/3：正在分析主角外觀特徵與參考圖姿勢服裝...",
        percent: 10,
        completed: 0,
        total: totalCount,
        etaSeconds: null
      });

      const [resolvedSubjectA, resolvedAnalysisB] = await Promise.all([
        subjectAnchor
          ? Promise.resolve(subjectAnchor)
          : analyzeSubjectIdentityA(imageAUrl, authConfig).catch(() => null),
        poseAnalysis
          ? Promise.resolve(poseAnalysis)
          : imageBUrl
          ? analyzeReferenceImageB(imageBUrl, authConfig).catch(() => null)
          : Promise.resolve(null)
      ]);

      let effectiveKeypoints = keypoints;
      if (
        !poseAnalysis &&
        Array.isArray(resolvedAnalysisB?.keypoints) &&
        resolvedAnalysisB.keypoints.length >= 10
      ) {
        effectiveKeypoints = COCO_KEYPOINTS.map((baseKp) => {
          const found = resolvedAnalysisB.keypoints.find((k) => k.id === baseKp.id);
          return found
            ? {
                ...baseKp,
                x: Math.max(20, Math.min(980, Math.round(found.x))),
                y: Math.max(20, Math.min(980, Math.round(found.y)))
              }
            : baseKp;
        });
      }

      let skeletonInlineData = null;
      if (mode !== "outfit-only" && Array.isArray(effectiveKeypoints) && effectiveKeypoints.length > 0) {
        const skelBlob = await renderSkeletonMapBlob(
          effectiveKeypoints,
          imageBSize?.width || 768,
          imageBSize?.height || 1024
        );
        if (skelBlob) {
          const tempSkelUrl = URL.createObjectURL(skelBlob);
          try {
            skeletonInlineData = await blobUrlToInlineData(tempSkelUrl);
          } finally {
            URL.revokeObjectURL(tempSkelUrl);
          }
        }
      }

      const inlineA = await blobUrlToInlineData(imageAUrl);
      const inlineB = imageBUrl ? await blobUrlToInlineData(imageBUrl) : null;

      const buildSingleSubjectEditPrompt = (idx, includeSkeleton) => {
        const lines = [
          `Editorial fashion portrait photography (variation #${idx + 1}).`,
          `Edit the provided portrait photograph so the exact same person is photographed in a new lookbook shot while keeping their natural face, hairstyle, and likeness (${weights.identity}% consistency).`
        ];

        if (includeSkeleton && mode !== "outfit-only") {
          lines.push(
            `Use the accompanying color-coded pose skeleton diagram as a spatial guide for head tilt, shoulder line, and arm placement (${weights.poseOutfit}% pose alignment), without drawing any lines in the final photo.`
          );
        }

        if (resolvedAnalysisB) {
          if (mode === "full-transform") {
            lines.push(`Pose & Framing (${weights.poseOutfit}% match): ${resolvedAnalysisB.poseDescription}`);
            lines.push(`Outfit Styling (${weights.poseOutfit}% match): Dress the subject in ${resolvedAnalysisB.outfitDescription}`);
            lines.push(`Camera & Lighting (${weights.composition}% match): ${resolvedAnalysisB.compositionAndLighting}`);
          } else if (mode === "pose-comp-only") {
            lines.push(`Keep the subject's original clothing from the photo, while adjusting their pose to: ${resolvedAnalysisB.poseDescription}`);
            lines.push(`Camera & Lighting (${weights.composition}% match): ${resolvedAnalysisB.compositionAndLighting}`);
          } else if (mode === "outfit-only") {
            lines.push(`Keep the subject's exact original pose and framing from the photo, while changing their outfit to: ${resolvedAnalysisB.outfitDescription}`);
            lines.push(`Lighting mood (${weights.composition}% match): ${resolvedAnalysisB.compositionAndLighting}`);
          }
        } else {
          lines.push(`Apply natural editorial posture, tailored clothing, and soft studio lighting.`);
        }

        if (userPrompt?.trim()) {
          lines.push(`Photography Style: ${userPrompt.trim()}`);
        }

        return lines.join("\n\n");
      };

      const buildDualLookbookPrompt = (idx) => {
        const lines = [
          `Editorial fashion lookbook portrait (take #${idx + 1}).`,
          `Feature the person from the first photo, preserving their natural facial features and hairstyle (${weights.identity}% consistency).`,
          `Use the second photo purely as a styling, outfit, and pose reference:`
        ];

        if (mode === "full-transform") {
          lines.push(
            `Dress the person from the first photo in the outfit from the second photo and arrange them in the same pose, camera framing, and lighting (${weights.poseOutfit}% styling & pose match, ${weights.composition}% lighting match).`
          );
        } else if (mode === "pose-comp-only") {
          lines.push(
            `Keep the person from the first photo wearing their original clothing, arranged in the pose and camera framing of the second photo (${weights.poseOutfit}% pose match).`
          );
        } else if (mode === "outfit-only") {
          lines.push(
            `Keep the person from the first photo in their exact original pose and framing, wearing the outfit shown in the second photo (${weights.poseOutfit}% wardrobe match).`
          );
        }

        if (userPrompt?.trim()) {
          lines.push(`Photography Style: ${userPrompt.trim()}`);
        }

        return lines.join("\n\n");
      };

      const buildTextConditionedFallbackPrompt = (idx) => {
        const subjectDesc =
          resolvedSubjectA?.subjectPortraitSummary ||
          "A stylish portrait subject with natural skin texture and warm, authentic expression";
        const outfitDesc =
          mode === "pose-comp-only"
            ? resolvedSubjectA?.originalOutfit || "modern smart-casual tailored outfit"
            : resolvedAnalysisB?.outfitDescription || "chic contemporary editorial fashion outfit";
        const poseDesc =
          resolvedAnalysisB?.poseDescription || "relaxed, confident natural editorial portrait pose";
        const compDesc =
          resolvedAnalysisB?.compositionAndLighting ||
          "medium portrait framing, soft diffused studio lighting, shallow depth of field";

        return [
          `High-resolution photorealistic editorial portrait photograph (take #${idx + 1}).`,
          `Subject: ${subjectDesc}.`,
          `Pose & Expression: ${poseDesc}.`,
          `Wardrobe: ${outfitDesc}.`,
          `Framing & Lighting: ${compDesc}.`,
          userPrompt?.trim() ? `Photography Direction: ${userPrompt.trim()}` : ""
        ]
          .filter(Boolean)
          .join("\n\n");
      };

      onProgress?.({
        stage: `步驟 2/3：正在並發渲染 ${totalCount} 張高畫質轉換影像...`,
        percent: 25,
        completed: 0,
        total: totalCount,
        etaSeconds: null
      });

      const generationStartTime = performance.now();

      const tasks = Array.from({ length: totalCount }, async (_, idx) => {
        if (idx > 0) await new Promise((r) => setTimeout(r, idx * 300));

        const runSingleSubjectPass = async (includeSkeleton) => {
          const parts = [{ text: buildSingleSubjectEditPrompt(idx, includeSkeleton) }, { inlineData: inlineA }];
          if (includeSkeleton && skeletonInlineData) {
            parts.push({ inlineData: skeletonInlineData });
          }
          const payload = {
            contents: [{ role: "user", parts }],
            generationConfig: {
              responseModalities: ["IMAGE"],
              imageConfig: { aspectRatio: aspectRatio || "3:4" }
            }
          };
          const result = await callGeminiEndpoint(GEMINI_IMAGE_MODEL, payload, signal, authConfig);
          return extractGeneratedBlobFromResponse(result, urlManager);
        };

        const runDualLookbookPass = async () => {
          const parts = [{ text: buildDualLookbookPrompt(idx) }, { inlineData: inlineA }];
          if (inlineB) parts.push({ inlineData: inlineB });
          const payload = {
            contents: [{ role: "user", parts }],
            generationConfig: {
              responseModalities: ["IMAGE"],
              imageConfig: { aspectRatio: aspectRatio || "3:4" }
            }
          };
          const result = await callGeminiEndpoint(GEMINI_IMAGE_MODEL, payload, signal, authConfig);
          return extractGeneratedBlobFromResponse(result, urlManager);
        };

        const runTextConditionedPass = async () => {
          const payload = {
            contents: [{ role: "user", parts: [{ text: buildTextConditionedFallbackPrompt(idx) }] }],
            generationConfig: {
              responseModalities: ["IMAGE"],
              imageConfig: { aspectRatio: aspectRatio || "3:4" }
            }
          };
          const result = await callGeminiEndpoint(GEMINI_IMAGE_MODEL, payload, signal, authConfig);
          const out = extractGeneratedBlobFromResponse(result, urlManager);
          return { ...out, note: "已透過特徵描述重繪管線完成生成" };
        };

        let itemResult;
        if (strategy === "dual-lookbook") {
          try {
            itemResult = await runDualLookbookPass();
          } catch (err1) {
            if (err1.name === "AbortError") throw err1;
            try {
              itemResult = await runSingleSubjectPass(false);
            } catch (err2) {
              if (err2.name === "AbortError") throw err2;
              itemResult = await runTextConditionedPass();
            }
          }
        } else {
          try {
            itemResult = await runSingleSubjectPass(Boolean(skeletonInlineData));
          } catch (err1) {
            if (err1.name === "AbortError") throw err1;
            if (skeletonInlineData) {
              try {
                itemResult = await runSingleSubjectPass(false);
              } catch (err2) {
                if (err2.name === "AbortError") throw err2;
                itemResult = await runTextConditionedPass();
              }
            } else {
              itemResult = await runTextConditionedPass();
            }
          }
        }

        completedCount += 1;
        const elapsedMs = performance.now() - generationStartTime;
        const avgMsPerImage = elapsedMs / completedCount;
        const remainingCount = totalCount - completedCount;
        const etaSeconds = remainingCount > 0 ? Math.max(1, Math.round((avgMsPerImage * remainingCount) / 1000)) : 0;
        const percent = Math.min(99, Math.round(25 + (completedCount / totalCount) * 75));

        const enrichedItem = {
          ...itemResult,
          id: `res_${Date.now()}_${idx}`,
          index: idx,
          timestamp: new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" })
        };

        onItemReady?.(enrichedItem);
        onProgress?.({
          stage:
            remainingCount > 0
              ? `已完成 ${completedCount} / ${totalCount} 張（預估剩餘約 ${etaSeconds} 秒）...`
              : `全部 ${totalCount} 張影像渲染完成！`,
          percent,
          completed: completedCount,
          total: totalCount,
          etaSeconds
        });

        return enrichedItem;
      });

      const settled = await Promise.allSettled(tasks);
      const succeeded = settled
        .filter((r) => r.status === "fulfilled")
        .map((r) => r.value)
        .sort((a, b) => a.index - b.index);
      const failed = settled.filter((r) => r.status === "rejected").map((r) => r.reason);

      if (succeeded.length === 0) {
        const abortErr = failed.find((e) => e?.name === "AbortError");
        if (abortErr) throw abortErr;
        const firstMsg = failed[0]?.finishReason || failed[0]?.message || "未知錯誤";
        throw new Error(
          `生成未完成（${firstMsg}）。請確認 API Key 設定正確，或嘗試更換清晰的照片再試一次。`
        );
      }

      const totalElapsedSec = ((performance.now() - batchStartTime) / 1000).toFixed(1);

      return {
        images: succeeded,
        failedCount: failed.length,
        totalElapsedSec,
        extractedAnalysisB: resolvedAnalysisB,
        extractedKeypoints: effectiveKeypoints,
        extractedSubjectA: resolvedSubjectA
      };
    }

    async function executeGeminiInpaint(
      { baseImageUrl, maskBlob, referenceImageUrl, prompt, strength },
      authConfig,
      urlManager,
      signal
    ) {
      const instruction = [
        `TASK: Precision Image Inpainting & Local Region Editing (Edit Strength: ${strength}%).`,
        `[IMAGE 1]: Original base photograph to modify.`,
        `[IMAGE 2]: Binary mask map where PURE WHITE (#FFFFFF) marks the exact region to regenerate, and PURE BLACK (#000000) regions MUST remain untouched and identical to Image 1.`,
        referenceImageUrl
          ? `[IMAGE 3]: Subject identity reference to keep facial features consistent if the edited region involves the person.`
          : "",
        `EDIT INSTRUCTION FOR WHITE MASK AREA: ${prompt}`,
        `Blend edges seamlessly with matching lighting, shadows, skin/fabric texture, and perspective.`
      ]
        .filter(Boolean)
        .join("\n\n");

      const parts = [{ text: instruction }];
      const inlineBase = await blobUrlToInlineData(baseImageUrl);
      parts.push({ inlineData: inlineBase });

      const tempMaskUrl = URL.createObjectURL(maskBlob);
      try {
        const inlineMask = await blobUrlToInlineData(tempMaskUrl);
        parts.push({ inlineData: inlineMask });
      } finally {
        URL.revokeObjectURL(tempMaskUrl);
      }

      if (referenceImageUrl) {
        const inlineRef = await blobUrlToInlineData(referenceImageUrl);
        parts.push({ inlineData: inlineRef });
      }

      const result = await callGeminiEndpoint(
        GEMINI_IMAGE_MODEL,
        {
          contents: [{ role: "user", parts }],
          generationConfig: { responseModalities: ["IMAGE"] }
        },
        signal,
        authConfig
      );

      const imgPart = result?.candidates?.[0]?.content?.parts?.find((p) => p.inlineData);
      if (!imgPart?.inlineData?.data) {
        throw new Error("局部重繪未回傳影像，請檢查塗抹範圍與修改說明。");
      }

      const outBlob = base64ToBlob(imgPart.inlineData.data, imgPart.inlineData.mimeType || "image/png");
      const objectUrl = urlManager.create(outBlob);

      return [{ objectUrl, note: "局部重繪完成" }];
    }

    // ========================================================================
    // 5. REFERENCE IMAGE CARD
    // ========================================================================
    function ReferenceImageCard({
      badge,
      title,
      subtitle,
      imageState,
      onImageChange,
      onNotify,
      darkMode,
      urlManager,
      isReferenceB = false,
      keypoints = [],
      onKeypointsChange,
      showSkeleton = false,
      onToggleSkeleton,
      poseAnalysis = null,
      onAnalyzePose,
      isAnalyzingPose = false
    }) {
      const fileInputRef = useRef(null);
      const overlayRef = useRef(null);
      const [zoom, setZoom] = useState(1);
      const [cropMode, setCropMode] = useState(false);
      const [cropRatio, setCropRatio] = useState("3:4");
      const [cropBox, setCropBox] = useState({ x: 15, y: 10, w: 70, h: 80 });
      const [draggingJoint, setDraggingJoint] = useState(null);

      const handleFile = async (file) => {
        if (!file) return;
        if (!["image/jpeg", "image/jpg", "image/png", "image/webp"].includes(file.type)) {
          onNotify("error", "僅支援 JPG、PNG 或 WEBP 格式圖片。");
          return;
        }
        if (file.size > 20 * 1024 * 1024) {
          onNotify("error", "圖片大小不可超過 20MB。");
          return;
        }
        try {
          const processed = await processUploadedImage(file, urlManager);
          onImageChange(processed);
          setZoom(1);
          setCropMode(false);
          onNotify("success", `已載入 ${badge} (${processed.width}×${processed.height})`);
        } catch (err) {
          onNotify("error", err.message);
        }
      };

      const handleRotate = () => {
        if (!imageState?.objectUrl) return;
        const img = new window.Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.naturalHeight;
          canvas.height = img.naturalWidth;
          const ctx = canvas.getContext("2d");
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate(Math.PI / 2);
          ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
          canvas.toBlob((blob) => {
            if (!blob) return;
            const nextUrl = urlManager.create(blob);
            onImageChange({
              ...imageState,
              width: canvas.width,
              height: canvas.height,
              objectUrl: nextUrl
            });
          }, "image/png");
        };
        img.src = imageState.objectUrl;
      };

      const applyCrop = () => {
        if (!imageState?.objectUrl) return;
        const img = new window.Image();
        img.onload = () => {
          const sx = Math.round((cropBox.x / 100) * img.naturalWidth);
          const sy = Math.round((cropBox.y / 100) * img.naturalHeight);
          const sw = Math.max(32, Math.round((cropBox.w / 100) * img.naturalWidth));
          const sh = Math.max(32, Math.round((cropBox.h / 100) * img.naturalHeight));

          const canvas = document.createElement("canvas");
          canvas.width = sw;
          canvas.height = sh;
          canvas.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

          canvas.toBlob((blob) => {
            if (!blob) return;
            const nextUrl = urlManager.create(blob);
            onImageChange({
              ...imageState,
              width: sw,
              height: sh,
              objectUrl: nextUrl
            });
            setCropMode(false);
            onNotify("success", `${badge} 已完成裁切 (${sw}×${sh})`);
          }, "image/png");
        };
        img.src = imageState.objectUrl;
      };

      const selectPresetRatio = (r) => {
        setCropRatio(r);
        if (r === "1:1") setCropBox({ x: 15, y: 15, w: 70, h: 70 });
        else if (r === "3:4") setCropBox({ x: 18, y: 10, w: 64, h: 80 });
        else if (r === "16:9") setCropBox({ x: 10, y: 25, w: 80, h: 50 });
        else setCropBox({ x: 10, y: 10, w: 80, h: 80 });
      };

      const handleSkeletonMove = (e) => {
        if (!draggingJoint || !overlayRef.current || !onKeypointsChange) return;
        const rect = overlayRef.current.getBoundingClientRect();
        const nx = Math.max(20, Math.min(980, Math.round(((e.clientX - rect.left) / rect.width) * 1000)));
        const ny = Math.max(20, Math.min(980, Math.round(((e.clientY - rect.top) / rect.height) * 1000)));
        onKeypointsChange(keypoints.map((kp) => (kp.id === draggingJoint ? { ...kp, x: nx, y: ny } : kp)));
      };

      const cardClass = darkMode
        ? "bg-zinc-900/90 border-zinc-800 text-zinc-100"
        : "bg-white border-zinc-200 text-zinc-900 shadow-sm";

      return (
        <div className={`rounded-2xl border p-4 sm:p-5 transition-all ${cardClass}`}>
          <div className="flex items-start justify-between gap-2 mb-3">
            <div>
              <div className="flex items-center gap-2">
                <span
                  className={`px-2 py-0.5 text-xs font-bold rounded-md ${
                    isReferenceB
                      ? "bg-violet-500/15 text-violet-400 border border-violet-500/30"
                      : "bg-indigo-500/15 text-indigo-400 border border-indigo-500/30"
                  }`}
                >
                  {badge}
                </span>
                <h3 className="font-semibold text-base">{title}</h3>
              </div>
              <p className={`text-xs mt-1 ${darkMode ? "text-zinc-400" : "text-zinc-500"}`}>{subtitle}</p>
            </div>

            {imageState && (
              <div className="flex items-center gap-1.5">
                <button
                  type="button"
                  onClick={() => fileInputRef.current?.click()}
                  title="更換照片"
                  className={`p-2 rounded-lg border text-xs transition ${
                    darkMode
                      ? "bg-zinc-800 border-zinc-700 hover:bg-zinc-700 text-zinc-200"
                      : "bg-zinc-100 border-zinc-200 hover:bg-zinc-200 text-zinc-700"
                  }`}
                >
                  <Icon name="upload" className="w-3.5 h-3.5" />
                </button>
                <button
                  type="button"
                  onClick={() => onImageChange(null)}
                  title="移除照片"
                  className="p-2 rounded-lg border border-rose-500/30 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 transition"
                >
                  <Icon name="trash" className="w-3.5 h-3.5" />
                </button>
              </div>
            )}
          </div>

          <input
            ref={fileInputRef}
            type="file"
            accept="image/jpeg,image/jpg,image/png,image/webp"
            className="hidden"
            onChange={(e) => handleFile(e.target.files?.[0])}
          />

          {!imageState ? (
            <div
              onDragOver={(e) => e.preventDefault()}
              onDrop={(e) => {
                e.preventDefault();
                handleFile(e.dataTransfer.files?.[0]);
              }}
              onClick={() => fileInputRef.current?.click()}
              className={`h-72 rounded-xl border-2 border-dashed flex flex-col items-center justify-center p-6 text-center cursor-pointer transition group ${
                darkMode
                  ? "border-zinc-700/80 bg-zinc-950/60 hover:border-indigo-500/60 hover:bg-indigo-950/10"
                  : "border-zinc-300 bg-zinc-50 hover:border-indigo-500 hover:bg-indigo-50/40"
              }`}
            >
              <div
                className={`w-12 h-12 rounded-2xl flex items-center justify-center mb-3 transition group-hover:scale-105 ${
                  isReferenceB ? "bg-violet-500/15 text-violet-400" : "bg-indigo-500/15 text-indigo-400"
                }`}
              >
                <Icon name="upload" className="w-6 h-6" />
              </div>
              <p className="text-sm font-medium mb-1">點擊或拖曳上傳照片</p>
              <p className={`text-xs ${darkMode ? "text-zinc-500" : "text-zinc-400"}`}>
                支援 JPG、PNG、WEBP（已自動清除 EXIF 隱私資訊）
              </p>
            </div>
          ) : (
            <div className="space-y-3">
              <div
                ref={overlayRef}
                onPointerMove={handleSkeletonMove}
                onPointerUp={() => setDraggingJoint(null)}
                onPointerLeave={() => setDraggingJoint(null)}
                className={`relative h-72 rounded-xl overflow-hidden flex items-center justify-center select-none border ${
                  darkMode ? "bg-zinc-950 border-zinc-800" : "bg-zinc-100 border-zinc-200"
                }`}
              >
                <img
                  src={imageState.objectUrl}
                  alt={badge}
                  style={{ transform: `scale(${zoom})` }}
                  className="max-h-full max-w-full object-contain transition-transform duration-150"
                />

                {cropMode && (
                  <div className="absolute inset-0 bg-black/55 flex items-center justify-center">
                    <div
                      style={{
                        left: `${cropBox.x}%`,
                        top: `${cropBox.y}%`,
                        width: `${cropBox.w}%`,
                        height: `${cropBox.h}%`
                      }}
                      className="absolute border-2 border-indigo-400 bg-indigo-500/10 shadow-[0_0_0_9999px_rgba(0,0,0,0.45)]"
                    >
                      <span className="absolute -top-6 left-0 bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded">
                        裁切比例 {cropRatio}
                      </span>
                    </div>
                  </div>
                )}

                {isReferenceB && showSkeleton && !cropMode && (
                  <svg viewBox="0 0 1000 1000" preserveAspectRatio="none" className="absolute inset-0 w-full h-full">
                    {POSE_LIMBS.map(([a, b, color], i) => {
                      const p1 = keypoints.find((k) => k.id === a);
                      const p2 = keypoints.find((k) => k.id === b);
                      if (!p1 || !p2) return null;
                      return (
                        <line
                          key={i}
                          x1={p1.x}
                          y1={p1.y}
                          x2={p2.x}
                          y2={p2.y}
                          stroke={color}
                          strokeWidth="12"
                          strokeLinecap="round"
                          strokeOpacity="0.88"
                        />
                      );
                    })}
                    {keypoints.map((kp) => (
                      <circle
                        key={kp.id}
                        cx={kp.x}
                        cy={kp.y}
                        r="18"
                        fill={kp.color}
                        stroke="#ffffff"
                        strokeWidth="4"
                        onPointerDown={(e) => {
                          e.stopPropagation();
                          setDraggingJoint(kp.id);
                        }}
                        className="cursor-grab active:cursor-grabbing"
                      />
                    ))}
                  </svg>
                )}

                <div className="absolute bottom-2 left-2 px-2 py-0.5 rounded-md bg-black/75 text-[10px] font-mono text-zinc-200">
                  {imageState.width} × {imageState.height}
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-1.5">
                  <button
                    type="button"
                    onClick={() => setZoom((z) => Math.max(0.5, +(z - 0.25).toFixed(2)))}
                    className={`p-1.5 rounded-lg border ${
                      darkMode ? "bg-zinc-800 border-zinc-700" : "bg-zinc-100 border-zinc-200"
                    }`}
                    title="縮小"
                  >
                    <Icon name="zoomOut" className="w-3.5 h-3.5" />
                  </button>
                  <span className="text-xs font-mono px-1">{Math.round(zoom * 100)}%</span>
                  <button
                    type="button"
                    onClick={() => setZoom((z) => Math.min(2.5, +(z + 0.25).toFixed(2)))}
                    className={`p-1.5 rounded-lg border ${
                      darkMode ? "bg-zinc-800 border-zinc-700" : "bg-zinc-100 border-zinc-200"
                    }`}
                    title="放大"
                  >
                    <Icon name="zoomIn" className="w-3.5 h-3.5" />
                  </button>
                  <button
                    type="button"
                    onClick={handleRotate}
                    className={`px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1 ${
                      darkMode ? "bg-zinc-800 border-zinc-700" : "bg-zinc-100 border-zinc-200"
                    }`}
                  >
                    <Icon name="rotateCw" className="w-3.5 h-3.5" />
                    <span>旋轉</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setCropMode((c) => !c)}
                    className={`px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1 ${
                      cropMode
                        ? "bg-indigo-600 border-indigo-500 text-white"
                        : darkMode
                        ? "bg-zinc-800 border-zinc-700"
                        : "bg-zinc-100 border-zinc-200"
                    }`}
                  >
                    <Icon name="crop" className="w-3.5 h-3.5" />
                    <span>裁切</span>
                  </button>
                </div>

                {isReferenceB && (
                  <div className="flex items-center gap-1.5">
                    <button
                      type="button"
                      onClick={onAnalyzePose}
                      disabled={isAnalyzingPose}
                      className="px-2.5 py-1.5 rounded-lg bg-violet-600 hover:bg-violet-500 disabled:opacity-50 text-white text-xs font-medium flex items-center gap-1"
                    >
                      <Icon name="activity" className={`w-3.5 h-3.5 ${isAnalyzingPose ? "animate-spin" : ""}`} />
                      <span>{isAnalyzingPose ? "解析中..." : "AI 解析姿勢與服裝"}</span>
                    </button>
                    <button
                      type="button"
                      onClick={onToggleSkeleton}
                      className={`p-1.5 rounded-lg border text-xs ${
                        showSkeleton
                          ? "bg-emerald-500/20 border-emerald-500/40 text-emerald-400"
                          : darkMode
                          ? "bg-zinc-800 border-zinc-700 text-zinc-400"
                          : "bg-zinc-100 border-zinc-200 text-zinc-600"
                      }`}
                      title="顯示/隱藏骨架線"
                    >
                      <Icon name={showSkeleton ? "eye" : "eyeOff"} className="w-3.5 h-3.5" />
                    </button>
                  </div>
                )}
              </div>

              {cropMode && (
                <div
                  className={`p-2 rounded-xl border flex flex-wrap items-center justify-between gap-2 text-xs ${
                    darkMode ? "bg-zinc-950 border-zinc-800" : "bg-zinc-50 border-zinc-200"
                  }`}
                >
                  <div className="flex items-center gap-1">
                    {["free", "1:1", "3:4", "16:9"].map((r) => (
                      <button
                        key={r}
                        type="button"
                        onClick={() => selectPresetRatio(r)}
                        className={`px-2 py-1 rounded ${
                          cropRatio === r ? "bg-indigo-600 text-white" : "bg-zinc-800 text-zinc-300"
                        }`}
                      >
                        {r}
                      </button>
                    ))}
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      type="button"
                      onClick={() => setCropMode(false)}
                      className="px-2 py-1 rounded bg-zinc-800 text-zinc-300"
                    >
                      取消
                    </button>
                    <button
                      type="button"
                      onClick={applyCrop}
                      className="px-2.5 py-1 rounded bg-emerald-600 text-white font-medium"
                    >
                      套用裁切
                    </button>
                  </div>
                </div>
              )}

              {isReferenceB && poseAnalysis && (
                <div
                  className={`p-3 rounded-xl border text-xs space-y-1.5 ${
                    darkMode ? "bg-violet-950/15 border-violet-500/25" : "bg-violet-50/70 border-violet-200"
                  }`}
                >
                  <div>
                    <span className="font-semibold text-violet-400">姿勢與動作：</span>
                    <span className={darkMode ? "text-zinc-300" : "text-zinc-700"}>
                      {poseAnalysis.poseDescription}
                    </span>
                  </div>
                  <div>
                    <span className="font-semibold text-violet-400">服裝與穿搭：</span>
                    <span className={darkMode ? "text-zinc-300" : "text-zinc-700"}>
                      {poseAnalysis.outfitDescription}
                    </span>
                  </div>
                  <div>
                    <span className="font-semibold text-violet-400">構圖與光影：</span>
                    <span className={darkMode ? "text-zinc-300" : "text-zinc-700"}>
                      {poseAnalysis.compositionAndLighting}
                    </span>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    // 6. MASK EDITOR
    // ========================================================================
    function SimpleMaskEditor({
      targetImage,
      referenceImage,
      availableSources,
      onSelectSource,
      onExecuteInpaint,
      isGenerating,
      darkMode
    }) {
      const baseCanvasRef = useRef(null);
      const maskCanvasRef = useRef(null);
      const [brushSize, setBrushSize] = useState(36);
      const [isEraser, setIsEraser] = useState(false);
      const [inpaintPrompt, setInpaintPrompt] = useState("修改服裝領口與材質細節，保持自然光影與人物五官不變");
      const [inpaintStrength, setInpaintStrength] = useState(80);
      const [isDrawing, setIsDrawing] = useState(false);
      const [historyStack, setHistoryStack] = useState([]);
      const [redoStack, setRedoStack] = useState([]);

      useEffect(() => {
        if (!targetImage?.objectUrl) return;
        const img = new window.Image();
        img.onload = () => {
          const w = img.naturalWidth;
          const h = img.naturalHeight;
          const baseCanvas = baseCanvasRef.current;
          const maskCanvas = maskCanvasRef.current;
          if (!baseCanvas || !maskCanvas) return;

          baseCanvas.width = w;
          baseCanvas.height = h;
          baseCanvas.getContext("2d").drawImage(img, 0, 0, w, h);

          maskCanvas.width = w;
          maskCanvas.height = h;
          const mCtx = maskCanvas.getContext("2d");
          mCtx.clearRect(0, 0, w, h);

          setHistoryStack([mCtx.getImageData(0, 0, w, h)]);
          setRedoStack([]);
        };
        img.src = targetImage.objectUrl;
      }, [targetImage]);

      const getCoords = (e) => {
        const canvas = maskCanvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY,
          scale: Math.max(scaleX, scaleY)
        };
      };

      const handleDown = (e) => {
        if (!maskCanvasRef.current || !targetImage) return;
        e.currentTarget.setPointerCapture(e.pointerId);
        setIsDrawing(true);
        const { x, y, scale } = getCoords(e);
        const ctx = maskCanvasRef.current.getContext("2d");
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = brushSize * scale;
        ctx.globalCompositeOperation = isEraser ? "destination-out" : "source-over";
        ctx.strokeStyle = "#8b5cf6";
        ctx.fillStyle = "#8b5cf6";
        ctx.beginPath();
        ctx.arc(x, y, (brushSize * scale) / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x, y);
      };

      const handleMove = (e) => {
        if (!isDrawing || !maskCanvasRef.current) return;
        const { x, y, scale } = getCoords(e);
        const ctx = maskCanvasRef.current.getContext("2d");
        ctx.lineWidth = brushSize * scale;
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const handleUp = () => {
        if (!isDrawing || !maskCanvasRef.current) return;
        setIsDrawing(false);
        const ctx = maskCanvasRef.current.getContext("2d");
        const snap = ctx.getImageData(0, 0, maskCanvasRef.current.width, maskCanvasRef.current.height);
        setHistoryStack((prev) => [...prev.slice(-20), snap]);
        setRedoStack([]);
      };

      const undo = () => {
        if (historyStack.length <= 1 || !maskCanvasRef.current) return;
        const curr = historyStack[historyStack.length - 1];
        const prev = historyStack[historyStack.length - 2];
        maskCanvasRef.current.getContext("2d").putImageData(prev, 0, 0);
        setHistoryStack((s) => s.slice(0, -1));
        setRedoStack((r) => [...r, curr]);
      };

      const redo = () => {
        if (redoStack.length === 0 || !maskCanvasRef.current) return;
        const next = redoStack[redoStack.length - 1];
        maskCanvasRef.current.getContext("2d").putImageData(next, 0, 0);
        setRedoStack((r) => r.slice(0, -1));
        setHistoryStack((s) => [...s, next]);
      };

      const clearMask = () => {
        if (!maskCanvasRef.current) return;
        const ctx = maskCanvasRef.current.getContext("2d");
        ctx.clearRect(0, 0, maskCanvasRef.current.width, maskCanvasRef.current.height);
        setHistoryStack((s) => [
          ...s.slice(-20),
          ctx.getImageData(0, 0, maskCanvasRef.current.width, maskCanvasRef.current.height)
        ]);
        setRedoStack([]);
      };

      const submitInpaint = () => {
        if (!targetImage?.objectUrl || !maskCanvasRef.current) return;
        const srcCanvas = maskCanvasRef.current;
        const outCanvas = document.createElement("canvas");
        outCanvas.width = srcCanvas.width;
        outCanvas.height = srcCanvas.height;
        const outCtx = outCanvas.getContext("2d");
        outCtx.fillStyle = "#000000";
        outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);

        const srcData = srcCanvas.getContext("2d").getImageData(0, 0, srcCanvas.width, srcCanvas.height);
        const dstData = outCtx.getImageData(0, 0, outCanvas.width, outCanvas.height);
        for (let i = 0; i < srcData.data.length; i += 4) {
          if (srcData.data[i + 3] > 20) {
            dstData.data[i] = 255;
            dstData.data[i + 1] = 255;
            dstData.data[i + 2] = 255;
            dstData.data[i + 3] = 255;
          }
        }
        outCtx.putImageData(dstData, 0, 0);

        outCanvas.toBlob((maskBlob) => {
          if (!maskBlob) return;
          onExecuteInpaint({
            baseImageUrl: targetImage.objectUrl,
            maskBlob,
            referenceImageUrl: referenceImage?.objectUrl || null,
            prompt: inpaintPrompt,
            strength: inpaintStrength
          });
        }, "image/png");
      };

      const cardClass = darkMode ? "bg-zinc-900 border-zinc-800" : "bg-white border-zinc-200";

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className={`lg:col-span-8 rounded-2xl border p-4 sm:p-5 ${cardClass}`}>
            <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div>
                <h2 className="text-base font-semibold flex items-center gap-2">
                  <Icon name="brush" className="w-4 h-4 text-violet-400" />
                  <span>局部微調重繪（塗抹想要修改的服裝、配件或背景）</span>
                </h2>
              </div>

              <div className="flex flex-wrap items-center gap-1.5">
                {availableSources.map((src) => (
                  <button
                    key={src.id}
                    type="button"
                    onClick={() => onSelectSource(src)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${
                      targetImage?.objectUrl === src.objectUrl
                        ? "bg-indigo-600 border-indigo-500 text-white"
                        : darkMode
                        ? "bg-zinc-800 border-zinc-700 text-zinc-300"
                        : "bg-zinc-100 border-zinc-200 text-zinc-700"
                    }`}
                  >
                    {src.label}
                  </button>
                ))}
              </div>
            </div>

            <div
              className={`p-2.5 rounded-xl border mb-4 flex flex-wrap items-center gap-2 ${
                darkMode ? "bg-zinc-950 border-zinc-800" : "bg-zinc-50 border-zinc-200"
              }`}
            >
              <button
                type="button"
                onClick={() => setIsEraser(false)}
                className={`px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 ${
                  !isEraser ? "bg-violet-600 text-white" : "bg-zinc-800 text-zinc-300"
                }`}
              >
                <Icon name="brush" className="w-3.5 h-3.5" />
                <span>塗抹筆刷</span>
              </button>
              <button
                type="button"
                onClick={() => setIsEraser(true)}
                className={`px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 ${
                  isEraser ? "bg-amber-600 text-white" : "bg-zinc-800 text-zinc-300"
                }`}
              >
                <Icon name="eraser" className="w-3.5 h-3.5" />
                <span>橡皮擦</span>
              </button>
              <button
                type="button"
                onClick={undo}
                disabled={historyStack.length <= 1}
                className="p-1.5 rounded-lg bg-zinc-800 disabled:opacity-40 text-zinc-200"
                title="復原"
              >
                <Icon name="undo" className="w-4 h-4" />
              </button>
              <button
                type="button"
                onClick={redo}
                disabled={redoStack.length === 0}
                className="p-1.5 rounded-lg bg-zinc-800 disabled:opacity-40 text-zinc-200"
                title="重做"
              >
                <Icon name="redo" className="w-4 h-4" />
              </button>
              <button
                type="button"
                onClick={clearMask}
                className="px-2.5 py-1.5 rounded-lg bg-rose-500/15 text-rose-400 border border-rose-500/30 text-xs"
              >
                清除塗抹
              </button>
            </div>

            {!targetImage ? (
              <div className="h-80 rounded-xl border-2 border-dashed border-zinc-700 flex items-center justify-center text-zinc-400 text-sm p-6 text-center">
                請先在「影像轉換工作室」上傳照片或生成圖片後，再進行局部微調。
              </div>
            ) : (
              <div className="relative rounded-xl overflow-hidden bg-zinc-950 border border-zinc-800 flex items-center justify-center min-h-[400px] p-2">
                <div className="relative inline-block max-w-full max-h-[520px]">
                  <canvas ref={baseCanvasRef} className="max-w-full max-h-[520px] w-auto h-auto block rounded-lg" />
                  <canvas
                    ref={maskCanvasRef}
                    onPointerDown={handleDown}
                    onPointerMove={handleMove}
                    onPointerUp={handleUp}
                    style={{ opacity: 0.55, touchAction: "none" }}
                    className="absolute inset-0 w-full h-full cursor-crosshair rounded-lg"
                  />
                </div>
              </div>
            )}
          </div>

          <div className={`lg:col-span-4 rounded-2xl border p-5 space-y-5 h-fit ${cardClass}`}>
            <h3 className="font-semibold text-base">微調參數</h3>

            <div>
              <div className="flex justify-between text-xs mb-1.5">
                <span className="text-zinc-400">筆刷粗細</span>
                <span className="font-mono text-indigo-400">{brushSize} px</span>
              </div>
              <input
                type="range"
                min="8"
                max="120"
                value={brushSize}
                onChange={(e) => setBrushSize(Number(e.target.value))}
                className="w-full accent-indigo-500"
              />
            </div>

            <div>
              <div className="flex justify-between text-xs mb-1.5">
                <span className="text-zinc-400">重繪幅度</span>
                <span className="font-mono text-emerald-400">{inpaintStrength}%</span>
              </div>
              <input
                type="range"
                min="15"
                max="100"
                value={inpaintStrength}
                onChange={(e) => setInpaintStrength(Number(e.target.value))}
                className="w-full accent-emerald-500"
              />
            </div>

            <div>
              <label className="block text-xs font-medium mb-1.5">塗抹區域修改內容說明</label>
              <textarea
                rows={4}
                value={inpaintPrompt}
                onChange={(e) => setInpaintPrompt(e.target.value)}
                placeholder="例如：換成米白色針織開襟衫、移除背景路人、調整袖口皺褶..."
                className={`w-full rounded-xl border p-3 text-xs leading-relaxed focus:outline-none focus:border-indigo-500 ${
                  darkMode ? "bg-zinc-950 border-zinc-800 text-zinc-100" : "bg-zinc-50 border-zinc-300 text-zinc-900"
                }`}
              />
            </div>

            <button
              type="button"
              disabled={!targetImage || isGenerating || !inpaintPrompt.trim()}
              onClick={submitInpaint}

            </button>

        </div>

    // ========================================================================
    // 9. MAIN APPLICATION
    // ========================================================================
    function App() {
      const [activeTab, setActiveTabState] = useState(() => {
        const hash = window.location.hash.replace(/^#\/?/, "");
        return ["studio", "mask", "history"].includes(hash) ? hash : "studio";
      });

      const setActiveTab = useCallback((tab) => {
        setActiveTabState(tab);
        if (window.location.hash !== `#/${tab}`) {
          window.location.hash = `#/${tab}`;
        }
      }, []);

      useEffect(() => {
        const onHashChange = () => {
          const hash = window.location.hash.replace(/^#\/?/, "");
          if (["studio", "mask", "history"].includes(hash)) {
            setActiveTabState(hash);
          }
        };
        window.addEventListener("hashchange", onHashChange);
        return () => window.removeEventListener("hashchange", onHashChange);
      }, []);

      const urlManagerRef = useRef(null);
      if (!urlManagerRef.current) {
        urlManagerRef.current = new ObjectUrlManager();
      }
      useEffect(() => {
        const manager = urlManagerRef.current;
        return () => manager.revokeAll();
      }, []);

      const [apiKey, setApiKeyState] = useState(() => loadInitialApiKey());
      const [proxyUrl, setProxyUrlState] = useState(() => loadInitialProxyUrl());
      const [isConfigOpen, setIsConfigOpen] = useState(false);

      const saveApiKey = useCallback((val) => {
        setApiKeyState(val);
        try {
          if (val) sessionStorage.setItem(SESSION_KEY_STORAGE, val);
          else sessionStorage.removeItem(SESSION_KEY_STORAGE);
        } catch {}
      }, []);

      const saveProxyUrl = useCallback((val) => {
        setProxyUrlState(val);
        try {
          if (val) sessionStorage.setItem(SESSION_PROXY_STORAGE, val);
          else sessionStorage.removeItem(SESSION_PROXY_STORAGE);
        } catch {}
      }, []);

      const authConfig = useMemo(() => ({ apiKey, proxyUrl }), [apiKey, proxyUrl]);

      const [darkMode, setDarkMode] = useState(true);
      const [toast, setToast] = useState(null);

      const [imageA, setImageA] = useState(null);
      const [imageB, setImageB] = useState(null);
      const [subjectAnchorA, setSubjectAnchorA] = useState(null);

      const [keypoints, setKeypoints] = useState(COCO_KEYPOINTS);
      const [showSkeleton, setShowSkeleton] = useState(false);
      const [poseAnalysis, setPoseAnalysis] = useState(null);
      const [isAnalyzingPose, setIsAnalyzingPose] = useState(false);

      const [weights, setWeights] = useState({
        identity: 90,
        poseOutfit: 85,
        composition: 75
      });

      const [mode, setMode] = useState("full-transform");
      const [strategy, setStrategy] = useState("disentangled");
      const [userPrompt, setUserPrompt] = useState(
        "自然肌膚質感，85mm 人像鏡頭，電影級柔和自然光，高畫質寫實攝影"
      );
      const [aspectRatio, setAspectRatio] = useState("3:4");
      const [variations, setVariations] = useState(1);

      const [isGenerating, setIsGenerating] = useState(false);
      const [progressInfo, setProgressInfo] = useState({
        stage: "",
        percent: 0,
        completed: 0,
        total: 0,
        etaSeconds: null
      });
      const [errorMsg, setErrorMsg] = useState(null);
      const [results, setResults] = useState([]);
      const [compareItem, setCompareItem] = useState(null);
      const abortControllerRef = useRef(null);

      const [maskTarget, setMaskTarget] = useState(null);
      const [history, setHistory] = useState([]);
      const [historySearch, setHistorySearch] = useState("");
      const [onlyFavorites, setOnlyFavorites] = useState(false);

      const notify = useCallback((type, message) => {
        setToast({ type, message });
        setTimeout(() => {
          setToast((prev) => (prev?.message === message ? null : prev));
        }, 4000);
      }, []);

      const handleImageAChange = useCallback(
        (nextImg) => {
          setImageA((prev) => {
            if (prev?.objectUrl && prev.objectUrl !== nextImg?.objectUrl && prev.objectUrl !== imageB?.objectUrl) {
              const inHistory = history.some(
                (h) => h.imageAUrl === prev.objectUrl || h.resultUrl === prev.objectUrl
              );
              if (!inHistory) urlManagerRef.current.revoke(prev.objectUrl);
            }
            return nextImg;
          });
          setSubjectAnchorA(null);
          if (nextImg?.objectUrl && (authConfig.apiKey || authConfig.proxyUrl)) {
            analyzeSubjectIdentityA(nextImg.objectUrl, authConfig)
              .then((anchor) => {
                if (anchor) setSubjectAnchorA(anchor);
              })
              .catch(() => {});
          }
        },
        [authConfig, history, imageB?.objectUrl]
      );

      const handleImageBChange = useCallback(
        async (nextImg) => {
          setImageB((prev) => {
            if (prev?.objectUrl && prev.objectUrl !== nextImg?.objectUrl && prev.objectUrl !== imageA?.objectUrl) {
              const inHistory = history.some(
                (h) => h.imageBUrl === prev.objectUrl || h.resultUrl === prev.objectUrl
              );
              if (!inHistory) urlManagerRef.current.revoke(prev.objectUrl);
            }
            return nextImg;
          });
          setPoseAnalysis(null);
          setShowSkeleton(false);
          if (!nextImg?.objectUrl || (!authConfig.apiKey && !authConfig.proxyUrl)) return;

          setIsAnalyzingPose(true);
          try {
            const analysis = await analyzeReferenceImageB(nextImg.objectUrl, authConfig);
            setPoseAnalysis(analysis);
            if (Array.isArray(analysis.keypoints) && analysis.keypoints.length >= 10) {
              const merged = COCO_KEYPOINTS.map((baseKp) => {
                const found = analysis.keypoints.find((k) => k.id === baseKp.id);
                return found
                  ? {
                      ...baseKp,
                      x: Math.max(20, Math.min(980, Math.round(found.x))),
                      y: Math.max(20, Math.min(980, Math.round(found.y)))
                    }
                  : baseKp;
              });
              setKeypoints(merged);
              setShowSkeleton(true);
            }
          } catch {}
          finally {
            setIsAnalyzingPose(false);
          }
        },
        [authConfig, history, imageA?.objectUrl]
      );

      const handleSwapImages = () => {
        if (!imageA && !imageB) return;
        const prevA = imageA;
        const prevB = imageB;
        setImageA(prevB);
        setImageB(prevA);
        setSubjectAnchorA(null);
        setPoseAnalysis(null);
        setShowSkeleton(false);
        notify("info", "已互換 Image A（主角）與 Image B（參考圖）");
      };

      const handleAnalyzeImageB = async () => {
        if (!imageB?.objectUrl) return;
        if (!apiKey.trim() && !proxyUrl.trim()) {
          setIsConfigOpen(true);
          notify("info", "請先設定 Gemini API Key");
          return;
        }
        setIsAnalyzingPose(true);
        try {
          const analysis = await analyzeReferenceImageB(imageB.objectUrl, authConfig);
          setPoseAnalysis(analysis);
          if (Array.isArray(analysis.keypoints) && analysis.keypoints.length >= 10) {
            const merged = COCO_KEYPOINTS.map((baseKp) => {
              const found = analysis.keypoints.find((k) => k.id === baseKp.id);
              return found
                ? {
                    ...baseKp,
                    x: Math.max(20, Math.min(980, Math.round(found.x))),
                    y: Math.max(20, Math.min(980, Math.round(found.y)))
                  }
                : baseKp;
            });
            setKeypoints(merged);
            setShowSkeleton(true);
          }
          notify("success", "已完成 Image B 姿勢、服裝與構圖分析！");
        } catch (err) {
          notify("error", `分析失敗：${err.message}`);
        } finally {
          setIsAnalyzingPose(false);
        }
      };

      const handleGenerate = async () => {
        if (!imageA) {
          notify("error", "請先上傳 Image A（人物主角照片）。");
          return;
        }
        if (!imageB) {
          notify("error", "請先上傳 Image B（姿勢、服裝與構圖參考照片）。");
          return;
        }
        if (!apiKey.trim() && !proxyUrl.trim()) {
          setIsConfigOpen(true);
          notify("info", "請先點擊右上角設定您的 Gemini API Key。");
          return;
        }

        const controller = new AbortController();
        abortControllerRef.current = controller;
        setIsGenerating(true);
        setResults([]);
        setProgressInfo({
          stage: "步驟 1/3：正在鎖定主角五官與解耦參考圖結構...",
          percent: 8,
          completed: 0,
          total: variations,
          etaSeconds: null
        });
        setErrorMsg(null);

        try {
          const {
            images: generated,
            failedCount,
            totalElapsedSec,
            extractedAnalysisB,
            extractedKeypoints,
            extractedSubjectA
          } = await generateGeminiTransformation(
            {
              mode,
              strategy,
              imageAUrl: imageA.objectUrl,
              imageBUrl: imageB.objectUrl,
              keypoints,
              imageBSize: { width: imageB.width, height: imageB.height },
              weights,
              userPrompt,
              aspectRatio,
              variations,
              poseAnalysis,
              subjectAnchor: subjectAnchorA,
              authConfig,
              urlManager: urlManagerRef.current,
              onProgress: (info) => setProgressInfo(info),
              onItemReady: (readyItem) => {
                setResults((prev) => {
                  const exists = prev.some((p) => p.id === readyItem.id);
                  const next = exists ? prev : [...prev, readyItem];
                  return next.sort((a, b) => a.index - b.index);
                });
              }
            },
            controller.signal
          );

          if (extractedAnalysisB && !poseAnalysis) setPoseAnalysis(extractedAnalysisB);
          if (extractedKeypoints) setKeypoints(extractedKeypoints);
          if (extractedSubjectA && !subjectAnchorA) setSubjectAnchorA(extractedSubjectA);

          setResults(generated);
          setHistory((prev) => [
            ...generated.map((item) => ({
              id: item.id,
              timestamp: new Date().toLocaleString("zh-TW"),
              mode,
              userPrompt,
              aspectRatio,
              weights: { ...weights },
              imageAUrl: imageA.objectUrl,
              imageBUrl: imageB.objectUrl,
              resultUrl: item.objectUrl,
              favorite: false
            })),
            ...prev
          ]);

          if (failedCount > 0) {
            notify(
              "info",
              `已生成 ${generated.length} 張影像（${failedCount} 張未完成），總耗時 ${totalElapsedSec} 秒。`
            );
          } else {
            notify("success", `成功生成 ${generated.length} 張轉換影像（耗時 ${totalElapsedSec} 秒）！`);
          }
        } catch (err) {
          if (err.name === "AbortError") {
            notify("info", "已停止生成任務。");
          } else {
            setErrorMsg(err.message);
            notify("error", `生成失敗：${err.message}`);
          }
        } finally {
          setIsGenerating(false);
          abortControllerRef.current = null;
        }
      };

      const handleCancel = () => {
        if (abortControllerRef.current) {
          abortControllerRef.current.abort();
          abortControllerRef.current = null;
          setIsGenerating(false);
        }
      };

      const handleInpaint = async (payload) => {
        if (!apiKey.trim() && !proxyUrl.trim()) {
          setIsConfigOpen(true);
          notify("info", "請先設定 Gemini API Key。");
          return;
        }

        const controller = new AbortController();
        abortControllerRef.current = controller;
        setIsGenerating(true);
        setErrorMsg(null);

        try {
          const generated = await executeGeminiInpaint(
            payload,
            authConfig,
            urlManagerRef.current,
            controller.signal
          );
          const enriched = generated.map((g, i) => ({
            ...g,
            id: `inpaint_${Date.now()}_${i}`,
            index: i,
            timestamp: new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" })
          }));

          setResults(enriched);
          setHistory((prev) => [
            ...enriched.map((item) => ({
              id: item.id,
              timestamp: new Date().toLocaleString("zh-TW"),
              mode: "局部重繪微調",
              userPrompt: payload.prompt,
              aspectRatio,
              weights: { ...weights },
              imageAUrl: payload.baseImageUrl,
              imageBUrl: null,
              resultUrl: item.objectUrl,
              favorite: false
            })),
            ...prev
          ]);
          setActiveTab("studio");
          notify("success", "局部微調重繪完成！");
        } catch (err) {
          if (err.name !== "AbortError") {
            setErrorMsg(err.message);
            notify("error", `局部重繪失敗：${err.message}`);
          }
        } finally {
          setIsGenerating(false);
          abortControllerRef.current = null;
        }
      };

      const downloadObjectUrl = (objectUrl, filename = "gemini_portrait.png") => {
        const a = document.createElement("a");
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        notify("success", `已下載 ${filename}`);
      };

      const setResultAsImageA = (objectUrl) => {
        const img = new window.Image();
        img.onload = () => {
          setImageA({
            name: `Transformed_${Date.now()}.png`,
            sizeFormatted: "Blob PNG",
            width: img.naturalWidth,
            height: img.naturalHeight,
            objectUrl
          });
          notify("success", "已將此生成圖設為 Image A，可繼續進行下一輪轉換！");
        };
        img.src = objectUrl;
      };

      const handleDeleteHistoryItem = (item) => {
        setHistory((prev) => prev.filter((h) => h.id !== item.id));
        if (
          item.resultUrl &&
          item.resultUrl !== imageA?.objectUrl &&
          item.resultUrl !== imageB?.objectUrl &&
          !results.some((r) => r.objectUrl === item.resultUrl)
        ) {
          urlManagerRef.current.revoke(item.resultUrl);
        }
      };

      const availableMaskSources = useMemo(() => {
        const list = [];
        results.forEach((r, idx) =>
          list.push({ id: r.id, label: `生成結果 #${idx + 1}`, objectUrl: r.objectUrl })
